name: Apply CARTO runtime config fix

on:
  push:
    branches:
      - fix/carto-api-key-env

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/carto-api-key-env
          fetch-depth: 0

      - name: Patch CARTO runtime config
        shell: python
        run: |
          from pathlib import Path

          # 1) Server runtime config endpoint
          server_path = Path('server.ts')
          server = server_path.read_text(encoding='utf-8')
          server_marker = '    if (url.pathname === "/health" && req.method === "GET") return json({ status: "ok", uptime: process.uptime() });\n'
          server_insert = server_marker + '''\n    // Browser-safe runtime config. CARTO requires the API key client-side,\n    // so expose only that key from the container environment.\n    if (url.pathname === "/api/config" && req.method === "GET") {\n      return json({ cartoApiKey: process.env.CARTO_API_KEY || "" });\n    }\n'''
          if '/api/config' not in server:
              if server_marker not in server:
                  raise SystemExit('Could not find server insertion marker')
              server = server.replace(server_marker, server_insert, 1)
          server_path.write_text(server, encoding='utf-8')

          # 2) Dashboard runtime config + all three CARTO tile calls
          index_path = Path('public/index.html')
          html = index_path.read_text(encoding='utf-8')
          bootstrap = r'''    // CARTO runtime config — key comes from server.ts /api/config, backed by .env
              let CARTO_API_KEY = '';
              const CARTO_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>';

              async function loadRuntimeConfig(){
                try {
                  const r = await fetch('/api/config', { cache: 'no-store' });
                  if (!r.ok) throw new Error(`Config HTTP ${r.status}`);
                  const cfg = await r.json();
                  CARTO_API_KEY = (cfg.cartoApiKey || '').trim();
                  if (!CARTO_API_KEY) console.warn('CARTO_API_KEY is not configured');
                } catch (e) {
                  console.error('Failed to load runtime config:', e);
                }
              }

              function addCartoBasemap(map){
                const base = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
                const url = CARTO_API_KEY ? `${base}?key=${encodeURIComponent(CARTO_API_KEY)}` : base;
                if (!CARTO_API_KEY) console.error('CARTO basemap key missing; check /api/config and CARTO_API_KEY in .env');
                return L.tileLayer(url, {
                  attribution: CARTO_ATTRIBUTION,
                  subdomains: 'abcd',
                  maxZoom: 20
                }).addTo(map);
              }

          '''
          script_marker = '  <script>\n'
          if 'async function loadRuntimeConfig()' not in html:
              if script_marker not in html:
                  raise SystemExit('Could not find main script block')
              html = html.replace(script_marker, script_marker + bootstrap, 1)

          replacements = [
              (
                  "              const m=L.map('ddMap',{zoomControl:true,attributionControl:false}).setView([rd.route[0].lat,rd.route[0].lon],15);\n              L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(m);",
                  "              const m=L.map('ddMap',{zoomControl:true,attributionControl:true}).setView([rd.route[0].lat,rd.route[0].lon],15);\n              addCartoBasemap(m);",
                  'day-detail map',
              ),
              (
                  "              const m=L.map(mapEl,{zoomControl:true,attributionControl:false}).setView([rd.route[0].lat,rd.route[0].lon],15);\n              L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(m);",
                  "              const m=L.map(mapEl,{zoomControl:true,attributionControl:true}).setView([rd.route[0].lat,rd.route[0].lon],15);\n              addCartoBasemap(m);",
                  'briefing map',
              ),
              (
                  "      leafletMap=L.map('routeMap',{zoomControl:true}).setView([d.route[0].lat,d.route[0].lon],15);\n      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CartoDB',maxZoom:19}).addTo(leafletMap);",
                  "      leafletMap=L.map('routeMap',{zoomControl:true,attributionControl:true}).setView([d.route[0].lat,d.route[0].lon],15);\n      addCartoBasemap(leafletMap);",
                  'route modal map',
              ),
          ]
          for old, new, name in replacements:
              if old in html:
                  html = html.replace(old, new, 1)
              elif new not in html:
                  raise SystemExit(f'Could not find expected {name} block')

          startup_old = '    loadBriefing();\n    // Polling:'
          startup_new = '    loadRuntimeConfig().finally(loadBriefing);\n    // Polling:'
          if startup_old in html:
              html = html.replace(startup_old, startup_new, 1)
          elif startup_new not in html:
              raise SystemExit('Could not find dashboard startup call')

          if html.count('addCartoBasemap(') - 1 != 3:
              raise SystemExit('Expected exactly three CARTO map call sites')
          index_path.write_text(html, encoding='utf-8')

          # 3) Keep the secret file out of Git
          ignore_path = Path('.gitignore')
          ignore = ignore_path.read_text(encoding='utf-8')
          if '.env\n' not in ignore.split('node_modules/\n')[-1]:
              if not ignore.endswith('\n'):
                  ignore += '\n'
              ignore += '.env\n'
          ignore_path.write_text(ignore, encoding='utf-8')

          # 4) Load .env in the example Compose deployment
          compose_path = Path('docker-compose.example.yml')
          compose = compose_path.read_text(encoding='utf-8')
          if '    env_file:\n      - .env\n' not in compose:
              marker = '    restart: unless-stopped\n'
              if marker not in compose:
                  raise SystemExit('Could not find compose insertion marker')
              compose = compose.replace(marker, marker + '    env_file:\n      - .env\n', 1)
          compose_path.write_text(compose, encoding='utf-8')

          # Remove this one-time workflow so the resulting PR only contains the fix.
          Path('.github/workflows/carto-runtime-fix.yml').unlink()

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts public/index.html .gitignore docker-compose.example.yml .github/workflows/carto-runtime-fix.yml
          git commit -m "fix: load CARTO API key from runtime env"
          git push origin HEAD:fix/carto-api-key-env
